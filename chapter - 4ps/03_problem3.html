<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelstud.com - Book your travel to bali</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Trave Booking form</h1>
    <form action=""></form>
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div> 
        <label for="phoneno">Phone Number:</label>
        <input type="tel" id="phoneno" placeholder="Enter your phone number" required>
    </div>
    <div> 
        <label for="adress">Address:</label>
        <input type="text" id="adress" placeholder="Enter your address" required>

    </div> 
    <div> 
        <input type="submit" id="submit" value="Submit">
    </div>
</body>
</html>
